name: Deploy docs

# Deliberately manual: publishing is a decision, not a side effect of merging.
# Run this workflow after merging docs changes you want live.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs exec blume build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@v5

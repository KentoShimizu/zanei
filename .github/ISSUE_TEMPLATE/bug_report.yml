name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy note:** never paste raw store contents, timelines, or event dumps —
        they contain your activity history. Redact aggressively.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zanei --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: zanei doctor --json
      description: Include when the problem involves recording or permissions.
      render: json
